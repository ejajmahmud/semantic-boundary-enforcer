[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-boundary-enforcer"
version = "0.1.0"
description = "Lexical and semantic boundary guard preventing agent goal drift by scoring semantic distance from the root task"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
semantic-boundary-enforcer = "semantic_boundary_enforcer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["semantic_boundary_enforcer*"]
